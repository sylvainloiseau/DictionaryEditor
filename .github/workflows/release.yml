# On push of a version tag (e.g., v1.0.0), with the version of the tag (v1.2.3 -> 1.2.3):
# - package: the native installers of DictionaryEditor (jlink + jpackage, module lift-gui).
#   Each OS builds in parallel and attaches its binaries to the GitHub release of the tag.
# - publish: the lift-fx library, with the parent POM, to Maven Central. The poms keep
#   their -SNAPSHOT version in the repository.
#
# Repository secrets the publish job needs (Settings > Secrets and variables > Actions):
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD  the user token generated on
#                                                   https://central.sonatype.com/account
#   GPG_PRIVATE_KEY   the armored private key: gpg --armor --export-secret-keys KEY_ID
#   GPG_PASSPHRASE    its passphrase

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: lift-fx to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25, the Central credentials and the signing key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Writes a settings.xml whose server "central" reads these two variables.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set the version from the tag
        shell: bash
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # The parent and lift-fx only (-pl lift-fx -am): lift-gui is not published. The UI
      # tests of lift-fx run headless (Monocle), as configured in the parent POM.
      - name: Test, sign and publish
        run: mvn -B -ntp -P release -pl lift-fx -am deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  package:
    name: ${{ matrix.runner }} (${{ matrix.javafx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            javafx: linux
            appimage_arch: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - runner: ubuntu-24.04-arm
            javafx: linux-aarch64
            appimage_arch: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          - runner: windows-latest
            javafx: win
          - runner: macos-latest
            javafx: mac-aarch64
            mac_label: apple-silicon
          - runner: macos-26-intel
            javafx: mac
            mac_label: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # lift-api comes from Maven Central: no credentials needed.
          cache: maven

      - name: Install Maven 3.9.9
        shell: bash
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz" | tar xz -C /tmp
          echo "/tmp/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Image jlink + installer debian (deb) (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mvn -B -ntp clean install -Pdist -DskipTests \
            "-Djavafx.platform=${{ matrix.javafx }}" \
            "-Dapp.version=${GITHUB_REF_NAME#v}" \
            -Djpackage.type=DEB -Djpackage.destSuffix=-deb

      - name: App image (jpackage) (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mvn -B -ntp -f lift-gui -Pdist jpackage:jpackage -DskipTests \
            "-Djavafx.platform=${{ matrix.javafx }}" \
            "-Dapp.version=${GITHUB_REF_NAME#v}" \
            -Djpackage.type=APP_IMAGE -Djpackage.destSuffix=-appimage

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.appimage_arch }}
          APPIMAGETOOL_VERSION: 1.9.1
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          # The runner has no FUSE: let the tool extract itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPDIR=lift-gui/target/DictionaryEditor.AppDir

          # Move the jpackage image out of target/jpackage-appimage so that the
          # release glob (lift-gui/target/jpackage*/**/*) only uploads the .AppImage file.
          mv lift-gui/target/jpackage-appimage/DictionaryEditor "$APPDIR"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/DictionaryEditor" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/DictionaryEditor.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DictionaryEditor
          Comment=Editor for LIFT dictionaries
          Exec=DictionaryEditor %f
          Icon=DictionaryEditor
          Categories=Office;
          Terminal=false
          EOF

          cp lift-gui/src/main/jpackage/DictionaryEditor.png "$APPDIR/DictionaryEditor.png"
          ln -s DictionaryEditor.png "$APPDIR/.DirIcon"

          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          /tmp/appimagetool "$APPDIR" \
            "lift-gui/target/jpackage-appimage/DictionaryEditor-${VERSION}-${ARCH}.AppImage"

      - name: Image jlink + installer MSI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mvn -B -ntp clean install -Pdist -DskipTests \
            "-Djavafx.platform=${{ matrix.javafx }}" \
            "-Dapp.version=${GITHUB_REF_NAME#v}" \
            -Djpackage.type=MSI -Djpackage.destSuffix=-msi

      - name: Installer EXE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mvn -B -ntp -f lift-gui -Pdist jpackage:jpackage -DskipTests \
            "-Djavafx.platform=${{ matrix.javafx }}" \
            "-Dapp.version=${GITHUB_REF_NAME#v}" \
            -Djpackage.type=EXE -Djpackage.destSuffix=-exe

      - name: Image jlink + installer DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mvn -B -ntp clean install -Pdist -DskipTests \
            "-Djavafx.platform=${{ matrix.javafx }}" \
            "-Dapp.version=${GITHUB_REF_NAME#v}" \
            -Djpackage.type=DMG

      - name: Name the DMG after its architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in lift-gui/target/jpackage/*.dmg; do
            mv "$f" "${f%.dmg}-${{ matrix.mac_label }}.dmg"
          done

      - name: Publish artifacts on the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            lift-gui/target/jpackage*/**/*
